<?xml version="1.0" encoding="UTF-8"?>
<!--
  Default system list installed by emulationstation-re.

  Copy this file to ~/.config/emulationstation/es_systems.cfg to customize it:
  the user copy always takes precedence over this system-wide file.

  ROMs go to ~/ROMs/<system>. A system is shown only when its folder contains
  at least one game with a matching extension.

  Each system uses the "libretro" emulator: ES-RE's integrated launcher writes
  the RetroArch configuration (controllers, BIOS, saves, per-game options) and
  selects the core from <cores>. The <command> is the fallback used when the
  launcher is disabled (eslauncher=0); it assumes the Arch Linux core path.
  On Debian, replace /usr/lib/libretro with /usr/lib/x86_64-linux-gnu/libretro
  (or /usr/lib/aarch64-linux-gnu/libretro on arm64), or keep eslauncher enabled
  (the default).
-->
<systemList>

  <system>
    <name>nes</name>
    <fullname>Nintendo Entertainment System</fullname>
    <path>~/ROMs/nes</path>
    <extension>.nes .fds .unf .unif .zip</extension>
    <command>retroarch --fullscreen -L /usr/lib/libretro/nestopia_libretro.so %ROM%</command>
    <platform>nes</platform>
    <theme>nes</theme>
    <emulators>
      <emulator name="libretro">
        <cores>
          <core name="nestopia" default="true" />
          <core name="mesen" />
        </cores>
      </emulator>
    </emulators>
  </system>

