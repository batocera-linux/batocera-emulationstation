<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ports : jeux et applications Linux lancés par des scripts .sh.

  Ce fichier est installé au niveau système et fusionné avec le fichier de base
  de l'utilisateur, y compris quand il utilise es_systems_custom.cfg.
  Les scripts sont copiés dans ~/ROMs/ports au premier démarrage.
-->
<systemList>

  <system>
    <name>ports</name>
    <fullname>Ports</fullname>
    <path>~/ROMs/ports</path>
    <extension>.sh</extension>
    <command>bash %ROM%</command>
    <platform>pc</platform>
    <theme>ports</theme>
  </system>

</systemList>
